; 翻訳スクリプトの設定。書き換えたら、スクリプトを起動し直してください。
; The API key is NOT here: set it with  export GEMINI_API_KEY="..."

[translator]
; VRChat を動かしている PC の IP アドレス（PC で ipconfig を実行して、IPv4 アドレスを見る）
PC_IP = 192.168.1.10
; PC の中継スクリプト（pc_osc_relay.py）の受け口
RELAY_PORT = 9002
; スマホがトグルの状態を受け取る番号
LISTEN_PORT = 9001

; Gemini のモデル。gemini-flash-latest は、いつも最新の Flash を指す
MODEL = gemini-flash-latest
; 原文も一緒に出すか（true / false）
SHOW_ORIGINAL = true
; 訳を出す場所: kat（ペットの上）/ chatbox（VRChat 標準の吹き出し）/ both
DISPLAY = kat
; アバターの KAT の同期設定（TranslatorConfig.KatSyncCount と同じ値。4 / 8 / 16）
KAT_SYNC = 8
; 翻訳の記録
LOG_FILE = ~/vrc_translation_log.tsv

[voice]
; 声の区切り。mic_check.py の表示を見ながら調整する
; 雑音の何倍の大きさを「声」とみなすか
MARGIN = 3.0
; しきい値の下限（静かな部屋で小さな物音を拾いすぎるときは上げる）
FLOOR_MIN = 200
; 声がこの秒数続いたら録音を始める
START_S = 0.15
; 無音がこの秒数続いたら、話し終わりとみなす
END_SILENCE_S = 0.8
; 話し始めの前を、この秒数さかのぼって入れる
PREROLL_S = 0.3
; 1 回の録音の最大の秒数
MAX_S = 60
; 声がこの秒数より短いもの（咳や物音）は捨てる
MIN_S = 0.5
